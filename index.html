<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global FileMaker Server Fleet Overview</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #111827;
      --text: #e2e8f0;
      --border: #1f2937;
      --cyan: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
      --brand: #0284c7;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px;
    }
    header {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }
    .server-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .server-card:hover {
      border-color: var(--brand);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .server-card.offline {
      border-color: var(--red);
    }
    .server-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .server-host {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .status-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--green);
      font-weight: bold;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.1);
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.2);
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .m-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }
    .m-value {
      font-size: 24px;
      font-weight: 500;
    }
    .m-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    .bar-bg {
      height: 8px; /* Thicker bar */
      background: #334155;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--cyan);
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .fleet-alert-banner {
      margin-bottom: 24px;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      background: var(--card-bg);
      transition: all 0.3s ease;
    }
    .fleet-alert-banner.healthy {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.25);
      color: #34d399;
    }
    .fleet-alert-banner.warning {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      animation: alert-pulse 2s infinite ease-in-out;
    }
    .fleet-alert-banner.danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
      animation: alert-pulse 1.5s infinite ease-in-out;
    }
    @keyframes alert-pulse {
      0%, 100% { box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
      50% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
    }
    .limit-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
    }
    .limit-badge.warning {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .limit-badge.danger {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
      animation: pulse-red 1.5s infinite;
    }
    .server-card.card-warning {
      border-color: rgba(245, 158, 11, 0.6) !important;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.12);
    }
    .server-card.card-danger {
      border-color: rgba(239, 68, 68, 0.7) !important;
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.22);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <h1>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
        <line x1="6" y1="6" x2="6.01" y2="6"></line>
        <line x1="6" y1="18" x2="6.01" y2="18"></line>
      </svg>
      Global FMS Fleet Overview
    </h1>
  </header>

  <div id="fleetAlertBanner" class="fleet-alert-banner healthy">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      <span id="fleetAlertText">Checking fleet resource utilization...</span>
    </div>
    <span id="fleetAlertSub" style="font-size: 11px; opacity: 0.8;">Threshold: 80% CPU / RAM / Disk / Sessions</span>
  </div>

  <div class="grid" id="fleetGrid">
    <!-- Cards generated by JS -->
  </div>

  <div style="margin-top: 40px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px;">
    <h2 style="font-size: 18px; margin-top: 0; margin-bottom: 20px; color: #94a3b8;">Fleet Resource Comparison (CPU & RAM)</h2>
    <div style="height: 300px; width: 100%;">
      <canvas id="fleetChart"></canvas>
    </div>
  </div>
  
  <script>
    
    let fleetChart;
    function initChart() {
      const ctx = document.getElementById('fleetChart').getContext('2d');
      fleetChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: servers.map(s => s.name),
          datasets: [
            {
              label: 'CPU Usage (%)',
              data: [0, 0, 0],
              backgroundColor: '#3b82f6',
              borderRadius: 4
            },
            {
              label: 'RAM Usage (GB)',
              data: [0, 0, 0],
              backgroundColor: '#8b5cf6',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              grid: { color: '#1f2937' },
              ticks: { color: '#94a3b8' }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8' }
            }
          },
          plugins: {
            legend: {
              labels: { color: '#e2e8f0' }
            }
          }
        }
      });
    }

    function updateChartData(serverIndex, cpu, ram) {
      if (fleetChart) {
        fleetChart.data.datasets[0].data[serverIndex] = parseFloat(cpu) || 0;
        fleetChart.data.datasets[1].data[serverIndex] = parseFloat(ram) || 0;
        fleetChart.update();
      }
    }

    const servers = [
      { id: 'hitachi', name: "Hitachi Server", host: 'hitachi.master-bom.com', webhook: 'https://fms.n8n.lexisolution.com/webhook/fms-live-dashboard' },
      { id: 'demo', name: "Demo Server", host: 'demo.master-bom.com', webhook: 'https://fms.n8n.lexisolution.com/webhook/fms-demo-dashboard' },
      { id: 'kiekert', name: "Kiekert Server", host: 'kiekert.master-bom.com', webhook: 'https://fms.n8n.lexisolution.com/webhook/fms-kiekert-dashboard' }
    ];

    function initGrid() {
      const grid = document.getElementById('fleetGrid');
      grid.innerHTML = servers.map(s => `
        <div class="server-card" id="card-${s.id}" onclick="window.location.href='${s.id}.html'">
          <div class="server-title">
            ${s.name}
            <div style="display: flex; align-items: center; gap: 6px;">
              <span id="limit-${s.id}"></span>
              <span class="status-badge" id="status-${s.id}">CONNECTING...</span>
            </div>
          </div>
          <div class="server-host">${s.host}</div>
          
          <div class="metrics-grid">
            <div>
              <div class="m-label">CPU USAGE</div>
              <div class="m-value" id="cpu-${s.id}">--%</div>
              <div class="bar-bg"><div class="bar-fill" id="cpu-bar-${s.id}" style="width: 0%; background: #3b82f6;"></div></div>
            </div>
            <div>
              <div class="m-label">MEMORY USAGE</div>
              <div class="m-value" id="ram-${s.id}">-- GB</div>
              <div class="bar-bg"><div class="bar-fill" id="ram-bar-${s.id}" style="width: 0%; background: #8b5cf6;"></div></div>
            </div>
            <div>
              <div class="m-label">ACTIVE SESSIONS</div>
              <div class="m-value" id="sess-${s.id}">--</div>
              <div class="m-sub">Connections</div>
            </div>
            <div>
              <div class="m-label">ELAPSED TIME</div>
              <div class="m-value" id="elap-${s.id}">-- ms</div>
              <div class="m-sub">Latency</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    const fleetAlerts = {};

    function updateFleetBanner() {
      const banner = document.getElementById('fleetAlertBanner');
      const text = document.getElementById('fleetAlertText');
      const sub = document.getElementById('fleetAlertSub');
      if (!banner || !text) return;

      const activeAlerts = Object.values(fleetAlerts).flat();
      if (activeAlerts.length === 0) {
        banner.className = 'fleet-alert-banner healthy';
        text.innerHTML = '<span style="color:#34d399;">● ALL SYSTEMS CLEAR:</span> All monitored servers operating well within safe capacity thresholds.';
        sub.innerText = 'Safe Thresholds: < 80% CPU, < 80% RAM, < 85% Disk, < 80% Sessions';
      } else {
        const hasDanger = activeAlerts.some(a => a.type === 'danger');
        banner.className = 'fleet-alert-banner ' + (hasDanger ? 'danger' : 'warning');
        const alertList = activeAlerts.map(a => '<strong>' + a.serverName + '</strong> (' + a.msg + ')').join(' &bull; ');
        text.innerHTML = (hasDanger ? '🚨 CRITICAL CAPACITY WARNING: ' : '⚠️ RESOURCE LIMIT WARNING: ') + alertList;
        sub.innerText = 'Immediate action recommended to prevent connection dropouts.';
      }
    }

    async function pollServer(server) {
      try {
        const cacheKey = 'fms_cache_live_' + server.host;
        const cacheTimeKey = 'fms_cache_time_live_' + server.host;
        const lastTime = parseInt(localStorage.getItem(cacheTimeKey) || "0");
        
        let data = null;
        let m = null;
        
        if (Date.now() - lastTime < 25000) {
           try {
               const cachedStr = localStorage.getItem(cacheKey);
               if (cachedStr) {
                   data = JSON.parse(cachedStr);
                   m = data.metrics || data;
               } else {
                   return;
               }
           } catch(e) {}
        }
        
        if (!data) {
           localStorage.setItem(cacheTimeKey, Date.now().toString());
           try {
               const res = await fetch(server.webhook, { method: 'GET', headers: { 'Accept': 'application/json' } });
               if (!res.ok) throw new Error("HTTP " + res.status);
               
               const textData = await res.text();
               if (!textData) throw new Error("Empty body");
               
               data = JSON.parse(textData);
               m = data.metrics || data;
               
               localStorage.setItem(cacheKey, JSON.stringify(data));
               localStorage.setItem(cacheTimeKey, Date.now().toString());
           } catch (err) {
               localStorage.setItem(cacheTimeKey, (Date.now() - 15000).toString());
               throw err;
           }
        }

        document.getElementById(`status-${server.id}`).innerText = "ONLINE";
        document.getElementById(`status-${server.id}`).className = "status-badge";
        document.getElementById(`card-${server.id}`).classList.remove('offline');

        const cpuNum = parseFloat(m.cpu || 0);
        const ramUsedNum = parseFloat(m.ramUsed || 0);
        const ramTotalNum = parseFloat(m.ramTotal || 64);
        const ramPct = ramTotalNum > 0 ? (ramUsedNum / ramTotalNum) * 100 : 0;
        const diskUsedNum = parseFloat(m.diskUsed || 0);
        const diskTotalNum = parseFloat(m.diskTotal || 100);
        const diskPct = diskTotalNum > 0 ? (diskUsedNum / diskTotalNum) * 100 : 0;
        const sessNum = parseInt(m.sessions || 0, 10);
        const sessMax = parseInt(m.sessionsMax || 100, 10);
        const sessPct = sessMax > 0 ? (sessNum / sessMax) * 100 : 0;

        document.getElementById(`cpu-${server.id}`).innerText = cpuNum.toFixed(1) + '%';
        document.getElementById(`cpu-bar-${server.id}`).style.width = Math.min(100, cpuNum) + '%';

        document.getElementById(`ram-${server.id}`).innerText = ramUsedNum.toFixed(1) + ' GB';
        document.getElementById(`ram-bar-${server.id}`).style.width = Math.min(100, ramPct) + '%';

        document.getElementById(`sess-${server.id}`).innerText = sessNum;
        document.getElementById(`elap-${server.id}`).innerText = (m.elapsed || 0) + ' ms';

        // Check resource limit thresholds
        const sAlerts = [];
        if (cpuNum >= 85) sAlerts.push({ type: 'danger', serverName: server.name, msg: 'CPU ' + cpuNum + '% Critical' });
        else if (cpuNum >= 75) sAlerts.push({ type: 'warning', serverName: server.name, msg: 'CPU ' + cpuNum + '% High' });

        if (ramPct >= 88) sAlerts.push({ type: 'danger', serverName: server.name, msg: 'RAM ' + ramPct.toFixed(0) + '% Critical' });
        else if (ramPct >= 80) sAlerts.push({ type: 'warning', serverName: server.name, msg: 'RAM ' + ramPct.toFixed(0) + '% High' });

        if (diskPct >= 90) sAlerts.push({ type: 'danger', serverName: server.name, msg: 'Disk ' + diskPct.toFixed(0) + '% Critical' });
        else if (diskPct >= 82) sAlerts.push({ type: 'warning', serverName: server.name, msg: 'Disk ' + diskPct.toFixed(0) + '% High' });

        if (sessPct >= 85) sAlerts.push({ type: 'danger', serverName: server.name, msg: 'Sessions ' + sessNum + '/' + sessMax });
        else if (sessPct >= 75) sAlerts.push({ type: 'warning', serverName: server.name, msg: 'Sessions ' + sessNum + '/' + sessMax });

        fleetAlerts[server.id] = sAlerts;
        updateFleetBanner();

        const card = document.getElementById(`card-${server.id}`);
        const limitTag = document.getElementById(`limit-${server.id}`);
        card.classList.remove('card-warning', 'card-danger');

        if (sAlerts.length > 0) {
          const topAlert = sAlerts[0];
          card.classList.add(topAlert.type === 'danger' ? 'card-danger' : 'card-warning');
          limitTag.innerHTML = `<span class="limit-badge ${topAlert.type}">⚠️ ${topAlert.msg}</span>`;
        } else {
          limitTag.innerHTML = '';
        }

        // Adjust bar colors dynamically based on limit
        document.getElementById(`cpu-bar-${server.id}`).style.background = cpuNum >= 85 ? '#ef4444' : (cpuNum >= 75 ? '#f59e0b' : '#3b82f6');
        document.getElementById(`ram-bar-${server.id}`).style.background = ramPct >= 88 ? '#ef4444' : (ramPct >= 80 ? '#f59e0b' : '#8b5cf6');

        const sIndex = servers.findIndex(s => s.id === server.id);
        updateChartData(sIndex, m.cpu, m.ramUsed);
        
      } catch (err) {
        document.getElementById(`status-${server.id}`).innerText = "OFFLINE";
        document.getElementById(`status-${server.id}`).className = "status-badge offline";
        document.getElementById(`card-${server.id}`).classList.add('offline');
      }
    }

    function pollAll() {
      servers.forEach(s => pollServer(s));
    }

    initGrid();
    initChart();
    pollAll();
    setInterval(pollAll, 30000);
  </script>
</body>
</html>
