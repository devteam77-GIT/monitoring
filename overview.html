<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global FileMaker Server Fleet Overview</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #111827;
      --text: #e2e8f0;
      --border: #1f2937;
      --cyan: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
      --brand: #0284c7;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px;
    }
    header {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }
    .server-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .server-card:hover {
      border-color: var(--brand);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .server-card.offline {
      border-color: var(--red);
    }
    .server-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .server-host {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .status-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--green);
      font-weight: bold;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.1);
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.2);
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .m-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 4px;
    }
    .m-value {
      font-size: 24px;
      font-weight: 500;
    }
    .m-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    .bar-bg {
      height: 8px; /* Thicker bar */
      background: #334155;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--cyan);
      border-radius: 2px;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
        <line x1="6" y1="6" x2="6.01" y2="6"></line>
        <line x1="6" y1="18" x2="6.01" y2="18"></line>
      </svg>
      Global FMS Fleet Overview
    </h1>
  </header>

  <div class="grid" id="fleetGrid">
    <!-- Cards generated by JS -->
  </div>

  <script>
    const servers = [
      { id: 'hitachi', name: "Hitachi Server", host: 'hitachi.master-bom.com', webhook: 'https://fms.n8n.lexisolution.com/webhook/fms-live-dashboard' },
      { id: 'demo', name: "Demo Server", host: 'demo.master-bom.com', webhook: 'https://fms.n8n.lexisolution.com/webhook/fms-demo-dashboard' },
      { id: 'kiekert', name: "Kiekert Server", host: 'kiekert.master-bom.com', webhook: 'https://fms.n8n.lexisolution.com/webhook/fms-kiekert-dashboard' }
    ];

    function initGrid() {
      const grid = document.getElementById('fleetGrid');
      grid.innerHTML = servers.map(s => `
        <div class="server-card" id="card-${s.id}" onclick="window.location.href='index.html?host=${s.host}'">
          <div class="server-title">
            ${s.name}
            <span class="status-badge" id="status-${s.id}">CONNECTING...</span>
          </div>
          <div class="server-host">${s.host}</div>
          
          <div class="metrics-grid">
            <div>
              <div class="m-label">CPU USAGE</div>
              <div class="m-value" id="cpu-${s.id}">--%</div>
              <div class="bar-bg"><div class="bar-fill" id="cpu-bar-${s.id}" style="width: 0%; background: #3b82f6;"></div></div>
            </div>
            <div>
              <div class="m-label">MEMORY USAGE</div>
              <div class="m-value" id="ram-${s.id}">-- GB</div>
              <div class="bar-bg"><div class="bar-fill" id="ram-bar-${s.id}" style="width: 0%; background: #8b5cf6;"></div></div>
            </div>
            <div>
              <div class="m-label">ACTIVE SESSIONS</div>
              <div class="m-value" id="sess-${s.id}">--</div>
              <div class="m-sub">Connections</div>
            </div>
            <div>
              <div class="m-label">ELAPSED TIME</div>
              <div class="m-value" id="elap-${s.id}">-- ms</div>
              <div class="m-sub">Latency</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function pollServer(server) {
      try {
        const res = await fetch(server.webhook, { method: 'GET', headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const m = data.metrics || data;

        document.getElementById(`status-${server.id}`).innerText = "ONLINE";
        document.getElementById(`status-${server.id}`).className = "status-badge";
        document.getElementById(`card-${server.id}`).classList.remove('offline');

        document.getElementById(`cpu-${server.id}`).innerText = (m.cpu || 0) + '%';
        document.getElementById(`cpu-bar-${server.id}`).style.width = (m.cpu || 0) + '%';

        document.getElementById(`ram-${server.id}`).innerText = (m.ramUsed || 0) + ' GB';
        document.getElementById(`ram-bar-${server.id}`).style.width = ((m.ramUsed / (m.ramTotal || 64)) * 100) + '%';

        document.getElementById(`sess-${server.id}`).innerText = m.sessions || 0;
        document.getElementById(`elap-${server.id}`).innerText = (m.elapsed || 0) + ' ms';
        
      } catch (err) {
        document.getElementById(`status-${server.id}`).innerText = "OFFLINE";
        document.getElementById(`status-${server.id}`).className = "status-badge offline";
        document.getElementById(`card-${server.id}`).classList.add('offline');
      }
    }

    function pollAll() {
      servers.forEach(s => pollServer(s));
    }

    initGrid();
    pollAll();
    setInterval(pollAll, 30000);
  </script>
</body>
</html>
